options.commissionNote=O TradeCheck aplica a fórmula configurada separadamente às compras e às vendas. No modo Trade, toda a posição é tratada como um único lote agregado: introduza o preço médio de compra da corretora, incluindo todas as comissões e encargos de compra. O TradeCheck não adiciona novamente os custos de compra e estima apenas a comissão de venda. Os planos Tiered ainda podem incluir custos variáveis de mercado, encaminhamento ou liquidez.
