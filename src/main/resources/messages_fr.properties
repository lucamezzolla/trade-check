options.commissionNote=TradeCheck applique la formule configurée séparément aux achats et aux ventes. En mode Trade, l'ensemble de la position est traité comme un lot agrégé unique : saisissez le prix moyen d'achat du courtier, incluant toutes les commissions et tous les frais d'achat. TradeCheck n'ajoute pas une seconde fois les coûts d'achat et estime uniquement la commission de vente. Les offres Tiered peuvent néanmoins inclure des frais variables liés à la place, au routage ou à la liquidité.
